# Frontend Next.js 16 (standalone) no Fly.io.
# Secrets de runtime (CLERK_SECRET_KEY, SUPABASE_SERVICE_ROLE_KEY,
# CLERK_WEBHOOK_SECRET, AUTO_REVIEW_RECONCILIATION_SECRET) sao setadas via
# `fly secrets set`, nunca aqui.
# As NEXT_PUBLIC_* ficam em [build.args] porque precisam estar presentes em
# build time (sao embutidas no bundle do browser) e sao todas publicas por
# design (anon key e publishable key vao para o cliente de qualquer forma).
app = "gui-analise-sistematica-frontend"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

  [build.args]
    NEXT_PUBLIC_SUPABASE_URL = "https://nryebmwlmxuwvynfuzsv.supabase.co"
    NEXT_PUBLIC_SUPABASE_ANON_KEY = "sb_publishable_nqJGyzUd0ackkC9jSDTo3w_0xjg1hDd"
    NEXT_PUBLIC_API_URL = "https://gui-analise-sistematica-api.fly.dev"
    NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY = "pk_test_aW5ub2NlbnQtZm94aG91bmQtODguY2xlcmsuYWNjb3VudHMuZGV2JA"
    NEXT_PUBLIC_CLERK_SIGN_IN_URL = "/auth/login"
    NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL = "/dashboard"

[deploy]
  # A nova Machine precisa passar no health check antes de receber trafego; a
  # antiga so e removida depois, evitando indisponibilidade durante o deploy.
  strategy = "bluegreen"

[http_service]
  internal_port = 3000
  force_https = true
  # Pausa quando ninguém usa, e não desligamento. Em 2026-08-10 o scale-to-zero
  # com "stop" (#644) derrubou o site: a Machine parada não conseguiu voltar
  # porque o host de gru onde ela estava presa ficou sem CPU livre ("insufficient
  # CPUs available ... on the current host"), e o proxy insistiu nela. Machine
  # suspensa, segundo a documentação do Fly, continua com CPU e memória
  # reservadas no host, então acordá-la não disputa capacidade; e volta em
  # centenas de milissegundos em vez de bootar o Next. Para o resto (snapshot
  # perdido, host em manutenção, crash em loop), o vigia agendado em
  # .github/workflows/fly-vigia.yml clona a Machine presa em outro host.
  #
  # Suspend exige Machine sem swap e com até 2 GB, por isso o swap saiu e a
  # memória foi para 1 GB (ver a seção vm abaixo).
  auto_stop_machines = "suspend"
  auto_start_machines = true
  # Duas Machines (#664) continuam: com tráfego baixo o proxy só acorda uma, e a
  # segunda, pausada, custa só disco e é a alternativa que não depende do mesmo
  # host. Quem as cria é o `flyctl scale count 2` do workflow.
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/health"

[[vm]]
  # 1 GB sem swap. Com 512 MB o next-server chegava a 467 MB usados mais 172 MB
  # de swap (Prometheus do Fly, 22/10 a 02/11/2026), e as duas Machines
  # abortaram (exit 134) em 01/11. Suspend não aceita swap, então a folga tem de
  # vir de memória. Sem esta seção, um deploy recriaria as Machines com o
  # default de 256 MB.
  size = "shared-cpu-1x"
  memory = "1gb"
