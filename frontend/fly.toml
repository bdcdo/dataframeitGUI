# Frontend Next.js 16 (standalone) no Fly.io.
# Secrets de runtime (CLERK_SECRET_KEY, SUPABASE_SERVICE_ROLE_KEY,
# CLERK_WEBHOOK_SECRET, AUTO_REVIEW_RECONCILIATION_SECRET) sao setadas via
# `fly secrets set`, nunca aqui.
# As NEXT_PUBLIC_* ficam em [build.args] porque precisam estar presentes em
# build time (sao embutidas no bundle do browser) e sao todas publicas por
# design (anon key e publishable key vao para o cliente de qualquer forma).
app = "gui-analise-sistematica-frontend"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

  [build.args]
    NEXT_PUBLIC_SUPABASE_URL = "https://nryebmwlmxuwvynfuzsv.supabase.co"
    NEXT_PUBLIC_SUPABASE_ANON_KEY = "sb_publishable_nqJGyzUd0ackkC9jSDTo3w_0xjg1hDd"
    NEXT_PUBLIC_API_URL = "https://gui-analise-sistematica-api.fly.dev"
    NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY = "pk_test_aW5ub2NlbnQtZm94aG91bmQtODguY2xlcmsuYWNjb3VudHMuZGV2JA"
    NEXT_PUBLIC_CLERK_SIGN_IN_URL = "/auth/login"
    NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL = "/dashboard"

[deploy]
  # A nova Machine precisa passar no health check antes de receber trafego; a
  # antiga so e removida depois, evitando indisponibilidade durante o deploy.
  strategy = "bluegreen"

[http_service]
  internal_port = 3000
  force_https = true
  # Sempre ligada, sem pausa nem desligamento por ociosidade. As duas formas de
  # scale-to-zero do Fly já derrubaram o site:
  #
  # - "stop" (#644), em 2026-08-10: a Machine parada não conseguiu voltar porque
  #   o host de gru onde ela estava presa ficou sem CPU livre ("insufficient
  #   CPUs available ... on the current host"), e o proxy insistiu nela.
  # - "suspend" (#837), em 2026-11-03: a Machine voltou da pausa com o relógio
  #   parado na hora em que tinha sido suspensa, quase 11 h atrás, e continuou
  #   assim por minutos. O Clerk recusou o token da sessão ("nbf" no futuro) e
  #   entrou em loop de redirecionamento; página e documento não carregavam.
  #
  # O contrato do deploy (test-frontend-fly-machine-contract.sh) só aceita "off"
  # aqui, e o postflight confere o mesmo na config aplicada às Machines.
  auto_stop_machines = "off"
  # A rede que reacende a Machine se ela parar por outro motivo (restart,
  # manutenção do host).
  auto_start_machines = true
  # Duas Machines (#664), para não depender de um host só. Com o autostop
  # desligado este valor é inerte; fica como trava contra um retorno silencioso
  # do scale-to-zero com cardinalidade 1. Quem cria as duas é o `flyctl scale
  # count 2` do workflow.
  min_machines_running = 2

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/health"

[[vm]]
  # 1 GB sem swap. Com 512 MB o next-server chegava a 467 MB usados mais 172 MB
  # de swap (Prometheus do Fly, 22/10 a 02/11/2026), e as duas Machines
  # abortaram (exit 134) em 01/11, então a folga vem de memória. Sem esta seção,
  # um deploy recriaria as Machines com o default de 256 MB.
  size = "shared-cpu-1x"
  memory = "1gb"
