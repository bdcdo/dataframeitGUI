name: Database contract tests

on:
  pull_request:
    paths:
      - ".github/workflows/database-tests.yml"
      - ".nvmrc"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "frontend/scripts/run-db-tests.sh"
      - "frontend/scripts/run-sql-test.sh"
      - "frontend/scripts/run-backend-integration.sh"
      - "frontend/supabase/migrations/**"
      # Glob, não a lista nominal: enquanto o filtro citava um arquivo só, as
      # suítes novas entravam no repo sem gate nenhum e ninguém percebia.
      - "frontend/supabase/tests/**"
      # Contratos do backend com o banco (#674): ver backend/tests/integration/.
      - "backend/services/llm_runner.py"
      - "backend/services/llm_rate_limiter.py"
      - "backend/services/auth.py"
      - "backend/services/auto_review_reconciliation.py"
      - "backend/tests/integration/**"
      # O pytest do contrato carrega este conftest.py antes dos testes.
      - "backend/tests/conftest.py"
      # O cliente (supabase-py/postgrest) e a config do pytest também mudam o
      # que o contrato exercita.
      - "backend/pyproject.toml"
      - "backend/uv.lock"
      # O conftest lê a URL e as chaves por config.py, e o Python do contrato
      # vem do .python-version.
      - "backend/config.py"
      - "backend/.python-version"
      # Portas, extensões e auth do Supabase local que as suítes usam.
      - "frontend/supabase/config.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database-contracts:
    name: Database contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Fonte única do Node do repo; um número fixo aqui ficava para trás.
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx supabase start
      - run: npx supabase db reset --local --no-seed

      # O mesmo runner do hook `db-tests` (pre-push): a lista de suítes vive só
      # em GATE_SUITES/PGTAP_SUITES/KNOWN_RED (run-db-tests.sh), e o runner
      # recusa suíte no disco fora dela. A lista escrita à mão aqui, um passo
      # por suíte, tinha ficado 17 suítes atrás. O runner imprime PASS/FAIL por
      # suíte e a cauda da saída de cada uma que falha, e roda por último o
      # contrato payload×schema dos writes de llm_runs (uv, abaixo).
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # Mesmo uv do backend/Dockerfile.
          version: "0.9.18"
      - name: Suítes de contrato do banco (run-db-tests.sh)
        run: npm run test:db
