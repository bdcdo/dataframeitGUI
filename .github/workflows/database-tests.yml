name: Database contract tests

# Sem gatilho de `pull_request`: quem o chama é o job `database` do ci.yml, em
# todo PR e em todo push na `main`, para que o resultado conte no `ci-required`
# (o filtro de `paths` que havia aqui deixava o banco fora do check
# obrigatório, e era mais uma lista mantida à mão).
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  # O runner confere que toda entrada de KNOWN_RED aponta para issue aberta.
  issues: read

jobs:
  database-contracts:
    name: Database contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Fonte única do Node do repo; um número fixo aqui ficava para trás.
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx supabase start
      - run: npx supabase db reset --local --no-seed

      # O mesmo runner do hook `db-tests` (pre-push): a lista de suítes vive só
      # em GATE_SUITES/PGTAP_SUITES/KNOWN_RED (run-db-tests.sh), e o runner
      # recusa suíte no disco fora dela. A lista escrita à mão aqui, um passo
      # por suíte, tinha ficado 17 suítes atrás. O runner imprime PASS/FAIL por
      # suíte e a cauda da saída de cada uma que falha, e roda por último o
      # contrato payload×schema dos writes de llm_runs (uv, abaixo).
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # Mesmo uv do backend/Dockerfile.
          version: "0.9.18"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Suítes de contrato do banco (run-db-tests.sh)
        run: npm run test:db
        env:
          # Para o `gh` da guarda de KNOWN_RED; no CI a consulta que falha reprova.
          GH_TOKEN: ${{ github.token }}
