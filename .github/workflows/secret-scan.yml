name: Secret scan (gitleaks)

# Sem gatilho de `pull_request` nem de `push`: quem o chama é o job `secret-scan`
# do ci.yml, em todo PR e em todo push na `main`, para que o resultado conte no
# `ci-required`. O evento que a gitleaks-action lê (o range do PR, os commits
# do push) é o do workflow que chama.
#
# Sem `concurrency` próprio: o do ci.yml já cancela o run anterior do mesmo PR.
# Um grupo daqui cancelaria, na `main`, o job do merge anterior, e o
# `ci-required` daquele commit ficaria vermelho sem ter achado segredo.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  # gitleaks-action chama GET /pulls/{n}/commits para descobrir o range a
  # escanear no evento pull_request — sem este read leva 403 e o check falha
  # antes de escanear (nao e vazamento). Mantemos write fora (so o comentario
  # inline de PR precisaria dele, e esse segue desligado abaixo).
  pull-requests: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Historico completo para o gitleaks computar o range de commits.
          fetch-depth: 0
      # Pin a SHA (v3.0.0) por supply-chain safety — tags sao refs mutaveis.
      # Conta pessoal (bdcdo): nao requer GITLEAKS_LICENSE (so organizacoes).
      # Chamado pelo ci.yml, escaneia o diff do PR e os commits do push. So o
      # `workflow_dispatch` escaneia a historia inteira, e nela o vazamento
      # pre-#157 (revogado no #165) esta no .gitleaksignore.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Comentario de PR desligado de proposito: ele exige `pull-requests:
          # write`, e mantemos o token em `contents: read` (menor privilegio).
          # O gate ja falha o check ao achar segredo e o log do gitleaks aponta
          # arquivo/linha/regra — o comentario inline seria so redundante.
          GITLEAKS_ENABLE_COMMENTS: "false"
