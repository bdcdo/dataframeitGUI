name: Contratos do Fly

# Os contratos das Machines e o teste do vigia rodavam só no pre-commit local,
# que `--no-verify`, a edição pela web ou uma máquina sem `pre-commit install`
# pulam. Aqui eles reprovam no servidor o que o pre-commit deixou passar, em
# especial a volta de um scale-to-zero ("stop" ou "suspend") no fly.toml: o
# postflight do deploy só o veria depois de aplicado às Machines.
#
# Sem filtro de `paths`: os passos rodam em segundos, e um check que não
# dispara fica "Expected" para sempre se um dia virar obrigatório (ver #649).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contratos:
    name: Contratos das Machines e vigia
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # jq, ruby e python3 (o tomllib, da stdlib desde o 3.11, lê os fly.toml)
      # vêm na imagem ubuntu-latest; os scripts não chamam o Fly.
      - name: Parser do fly.toml
        run: bash .github/scripts/test-fly-toml-contract.sh
      - name: Contrato do frontend
        run: bash .github/scripts/test-frontend-fly-machine-contract.sh
      - name: Contrato do backend
        run: bash .github/scripts/test-backend-fly-machine-contract.sh
      - name: Vigia
        run: bash .github/scripts/test-fly-vigia.sh
      # O teste do hook `toolchain-pins` (pre-push), que o merge pela web de um
      # PR do Dependabot pula (#554). Só usa a stdlib, então roda no python3 da
      # imagem; o pytest carregaria o conftest.py, que importa o backend todo.
      - name: Pinos da toolchain do backend
        run: |
          python3 -c '
          import sys; sys.path.insert(0, "backend/tests")
          import test_toolchain_pins as t
          tests = [f for n, f in vars(t).items() if n.startswith("test_")]
          assert tests, "nenhum test_* em backend/tests/test_toolchain_pins.py"
          for f in tests: f()
          '
