name: Vigia das Machines (Fly.io)

# As duas apps ficam sempre ligadas (auto_stop "off"), mas uma Machine que para
# por outro motivo e não volta derruba a app até alguém agir; este vigia age
# sozinho, e uma vez por hora confere também o relógio das Machines. Lógica e
# motivo em .github/scripts/fly-vigia.sh.
on:
  schedule:
    # Uma vez por hora, com sonda HTTP e conferência do relógio.
    - cron: '7 * * * *'
    # Nas outras passadas, só estado e eventos das Machines, sem tocar as apps.
    - cron: '22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Vigia do frontend
    runs-on: ubuntu-latest
    # Mesma fila do deploy do frontend: durante um bluegreen há Machines
    # transitórias que o vigia não pode tomar por presas.
    concurrency:
      group: fly-deploy-frontend
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pin a SHA (tag 1.6) por supply-chain safety, como nos workflows de deploy.
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      # A sonda vai ao hostname .fly.dev, e não ao domínio próprio: ela testa a
      # borda do Fly e as Machines, que é o que o vigia sabe consertar, sem
      # depender do DNS e do certificado de dataframeit.com.br. Um defeito ali
      # deixaria a sonda vermelha sem Machine nenhuma presa.
      - name: Conferir e consertar Machines
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_FRONTEND }}
          VIGIA_MODO: ${{ github.event.schedule != '22,37,52 * * * *' && 'probe' || '' }}
        run: bash .github/scripts/fly-vigia.sh gui-analise-sistematica-frontend https://gui-analise-sistematica-frontend.fly.dev/api/health ${VIGIA_MODO:+"$VIGIA_MODO"}

  api:
    name: Vigia da API
    runs-on: ubuntu-latest
    concurrency:
      group: fly-deploy-backend
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      - name: Conferir e consertar Machines
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          VIGIA_MODO: ${{ github.event.schedule != '22,37,52 * * * *' && 'probe' || '' }}
        run: bash .github/scripts/fly-vigia.sh gui-analise-sistematica-api https://gui-analise-sistematica-api.fly.dev/health ${VIGIA_MODO:+"$VIGIA_MODO"}
